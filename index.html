<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>architectural design environmental psychology behaviour research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F8F5;
    --ink:#1E201F;
    --pine:#3A5240;
    --pine-tint:#EAF0E7;
    --sage:#7C8B5B;
    --slate:#3E5B66;
    --slate-tint:#E9EEF0;
    --slate-tint-light:#F3F7F9;
    --slate-light:#6F94A0;
    --white:#FFFFFF;
    --tag-radius:4px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;cursor:none;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-weight:300;
    overflow-x:hidden;
    position:relative;
  }
  h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;font-weight:300;}
  a{color:inherit;text-decoration:none;cursor:none;}
  .label{
    font-family:'Jost',sans-serif;text-transform:uppercase;letter-spacing:0.15em;
    font-size:0.9rem;color:var(--ink);opacity:0.55;
  }
  .label .label-dot{opacity:1;font-size:1.6em;color:var(--ink);font-weight:600;}
  .mdot{display:inline-block;font-size:1.5em;font-weight:600;line-height:1;vertical-align:-0.05em;}
  section,footer{scroll-margin-top:50px;}

  .grain{position:fixed;inset:0;z-index:9998;pointer-events:none;opacity:0.03;mix-blend-mode:multiply;}

  /* FLOWER CURSOR */
  #cursorFlower{
    position:fixed;top:0;left:0;width:30px;height:30px;pointer-events:none;z-index:9999;
    transform:translate(-50%,-50%);transition:width 0.25s,height 0.25s;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,0.25));
  }
  @media(max-width:900px){ #cursorFlower{display:none;} html{cursor:auto;} a{cursor:pointer;} }

  /* PRELOADER */
  #preloader{
    position:fixed;inset:0;background:var(--pine);color:var(--bg);z-index:10000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.15rem;
  }
  #preloader .pl-word{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.6rem,5vw,3.2rem);
    text-transform:lowercase;opacity:0;
  }

  .nav-backdrop{
    position:fixed;top:0;left:0;right:0;height:50px;z-index:99;
    background:rgba(234,240,231,var(--nav-alpha,0.55));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(30,32,31,0.06);
    transition:background 0.15s ease-out;
  }
  nav{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:0.75rem 3rem;z-index:100;
  }
  nav .logo{font-family:'Poppins',sans-serif;font-weight:500;font-size:1.25rem;letter-spacing:0.01em;text-transform:lowercase;color:#4B554D;}
  nav ul{display:flex;gap:1.8rem;list-style:none;}
  nav ul li a{font-size:0.95rem;letter-spacing:0.06em;font-weight:500;color:var(--ink);opacity:0.85;}
  nav ul li a .n{opacity:0.55;margin-right:0.3rem;font-size:0.85rem;font-weight:500;}

  /* HERO VIEWPORT: label + collage + tagline + tags + marquee + scroll cue, locked to one screen, evenly spaced */
  .hero-viewport{
    height:100vh;min-height:600px;background:var(--white);
    display:flex;flex-direction:column;justify-content:center;align-items:stretch;
    padding-top:50px; /* fixed nav offset */
    gap:clamp(0.9rem,2.4vh,1.8rem);
  }

  /* HERO */
  .hero{
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;position:relative;padding:0 2rem;flex:0 0 auto;
  }
  .hero .label{margin-bottom:0;}

  /* MOODBOARD COLLAGE: single static image, full-bleed edge to edge */
  .moodboard-wrap{
    width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);
    flex:0 0 auto;
  }
  .moodboard{display:block;width:100%;aspect-ratio:2400/536;object-fit:cover;}

  /* TAGLINE + TAGS: separate rhythm steps, same gap as everything else */
  .tagline{
    max-width:800px;margin:0 auto;padding:0 2rem;text-align:center;flex:0 0 auto;
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.5rem,3vw,2.2rem);
    color:var(--pine);text-transform:lowercase;line-height:1.35;opacity:0;
  }
  .roles{
    max-width:800px;margin:0 auto;padding:0 2rem;flex:0 0 auto;
    display:flex;gap:0.6rem;flex-wrap:wrap;justify-content:center;
  }
  .roles span{
    font-size:0.82rem;letter-spacing:0.06em;text-transform:lowercase;opacity:0;
    padding:0.5rem 1.1rem;border:1px solid rgba(30,32,31,0.22);border-radius:var(--tag-radius);
    background:var(--pine-tint);
  }

  /* MARQUEE */
  .marquee-wrap{
    flex:0 0 auto;
    border-top:1px solid rgba(30,32,31,0.15);border-bottom:1px solid rgba(30,32,31,0.15);
    padding:0.6rem 0;overflow:hidden;white-space:nowrap;background:var(--slate-tint);
  }
  .marquee{display:inline-block;font-size:1rem;letter-spacing:0.12em;text-transform:lowercase;animation:scroll-left 32s linear infinite;}
  .marquee-wrap:hover .marquee{animation-duration:10s;}
  .marquee span{margin:0 1.1rem;color:var(--ink);opacity:0.85;}
  .marquee span.accent{color:var(--slate);opacity:1;}
  .marquee span.mdot{opacity:0.45;}
  @keyframes scroll-left{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  /* SCROLL CUE */
  .scroll-cue{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:0.5rem;
    font-size:0.82rem;letter-spacing:0.12em;text-transform:lowercase;opacity:0.55;
  }
  .scroll-cue .scroll-line{width:1px;height:26px;background:rgba(30,32,31,0.35);overflow:hidden;position:relative;}
  .scroll-cue .scroll-line::after{
    content:'';position:absolute;left:0;top:-100%;width:100%;height:100%;background:var(--pine);
    animation:scrollLineDrop 1.8s ease-in-out infinite;
  }
  @keyframes scrollLineDrop{0%{top:-100%;}60%,100%{top:100%;}}

  /* SECTION HEADER */
  .section-head{
    max-width:1300px;margin:0 auto;padding:0 2rem;
    display:flex;justify-content:space-between;align-items:flex-end;
    padding-top:2.2rem;margin-bottom:1.6rem;flex-wrap:wrap;gap:1rem;
  }
  .section-head .num{font-size:1.15rem;letter-spacing:0.1em;opacity:0.55;text-transform:lowercase;}
  .section-head h2{font-size:clamp(2.2rem,4.5vw,3.5rem);text-transform:lowercase;overflow:hidden;}
  .section-head h2 .wipe{display:inline-block;clip-path:inset(0 100% 0 0);}
  .section-intro{max-width:1300px;margin:0 auto 2rem;padding:0 2rem;font-size:1.12rem;line-height:1.7;opacity:0.8;text-align:justify;text-justify:inter-word;}
  .section-block{padding-bottom:4rem;}
  .section-block.tint-pine{background:var(--pine-tint);}
  .section-block.tint-slate{background:var(--slate-tint);}
  .section-block.tint-white{background:var(--white);}
  .section-block.tint-slate-light{background:var(--slate-tint-light);}

  /* GRID / CARDS */
  .grid{max-width:920px;margin:0 auto;padding:0 2rem 2rem;display:grid;grid-template-columns:repeat(2,1fr);gap:2.5rem;}
  .card{position:relative;overflow:hidden;border-radius:6px;transform-style:preserve-3d;will-change:transform;display:block;}
  .card-media{
    height:320px;background-size:cover;background-position:center;
    display:flex;flex-direction:column;justify-content:flex-end;gap:0.5rem;padding:1.5rem;position:relative;
  }
  .card-media::after{content:'';position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.5), transparent 60%);}
  .card-media .chips{position:relative;z-index:1;display:flex;gap:0.4rem;flex-wrap:wrap;}
  .card-media .chips span{
    color:#fff;font-size:0.72rem;letter-spacing:0.08em;text-transform:lowercase;
    background:var(--tagtint, rgba(30,32,31,0.4));
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    border:1px solid rgba(255,255,255,0.55);padding:0.25rem 0.7rem;border-radius:var(--tag-radius);
  }
  .card-info{padding:1.4rem 0.2rem;}
  .card-info .meta{font-size:0.85rem;opacity:0.55;letter-spacing:0.05em;text-transform:lowercase;margin-bottom:0.5rem;}
  .card-info h3{font-size:1.6rem;margin-bottom:0.5rem;text-transform:lowercase;}
  .card-info p{font-size:0.98rem;line-height:1.6;opacity:0.8;}

  /* RESEARCH LIST */
  .research-list{max-width:1300px;margin:0 auto;padding:0 2rem;}
  .research-item{border-top:1px solid rgba(30,32,31,0.15);padding:2.5rem 0;display:grid;grid-template-columns:160px 1fr auto;gap:2rem;align-items:start;transition:background 0.25s;}
  .research-item:last-child{border-bottom:1px solid rgba(30,32,31,0.15);}
  .research-item:hover{background:rgba(30,32,31,0.03);}
  .research-item .r-thumb{width:160px;height:120px;border-radius:6px;background:var(--pine-tint);background-size:cover;background-position:center;flex-shrink:0;}
  .research-item h3{font-size:1.7rem;margin-bottom:0.6rem;text-transform:lowercase;}
  .research-item .r-sub{font-size:0.92rem;letter-spacing:0.05em;text-transform:lowercase;opacity:0.55;margin-bottom:0.8rem;}
  .research-item p{font-size:1.02rem;line-height:1.7;opacity:0.85;max-width:640px;margin-bottom:1rem;}
  .research-item .r-tagcol{display:flex;flex-direction:column;gap:0.5rem;align-items:flex-end;}
  .research-item .r-tagcol span{
    white-space:nowrap;font-size:0.78rem;letter-spacing:0.06em;text-transform:lowercase;
    color:var(--slate);border:1px solid var(--slate);padding:0.3rem 0.8rem;border-radius:var(--tag-radius);
  }

  /* COLLABORATIONS: same card language as practice (image + chips + info below),
     plus a hover-reveal description on the image itself; not a link. */
  .collab-grid{max-width:1300px;margin:0 auto;padding:0 2rem 2rem;display:grid;grid-template-columns:repeat(2,1fr);gap:2.5rem;}
  .collab-card2{position:relative;}
  .collab-card2.pending .card-media{opacity:0.7;}
  .collab-hover{
    position:absolute;inset:0;z-index:2;background:rgba(255,255,255,0.78);
    display:flex;align-items:center;justify-content:center;padding:2rem;
    opacity:0;transition:opacity 0.3s ease;pointer-events:none;
  }
  .card-media:hover .collab-hover{opacity:1;}
  .collab-hover p{font-size:1rem;line-height:1.65;color:var(--ink);text-align:center;}
  @media(max-width:800px){ .collab-grid{grid-template-columns:1fr;} }

  /* NOTE: lighter background, dark text */
  .note-band{background:transparent;color:var(--ink);padding:3.5rem 2rem;}
  .note-band-inner{max-width:1300px;margin:0 auto;}
  .note-eyebrow{font-size:1.15rem;letter-spacing:0.1em;opacity:0.55;text-transform:lowercase;margin-bottom:0.6rem;}
  .note-brand{display:flex;align-items:baseline;gap:1rem;margin-bottom:1.2rem;}
  .note-brand .note-word{font-family:'Cormorant Garamond',serif;font-size:3rem;font-style:italic;text-transform:lowercase;color:var(--slate);}
  .note-brand .note-sub{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-style:italic;text-transform:lowercase;color:var(--slate);opacity:1;}
  .note-desc{font-size:1.12rem;line-height:1.75;opacity:0.9;margin-bottom:2.5rem;text-align:justify;text-justify:inter-word;}
  .note-honest{
    max-width:680px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;
    opacity:0.8;margin-bottom:3rem;border-left:2px solid rgba(30,32,31,0.25);padding-left:1.2rem;
  }
  .note-posts-label{font-size:0.75rem;letter-spacing:0.15em;text-transform:lowercase;opacity:0.55;margin-bottom:1.5rem;}
  .note-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.8rem;}
  .note-card{border:1px solid rgba(30,32,31,0.15);border-radius:6px;padding:1.6rem;transition:background 0.3s ease;background:rgba(255,255,255,0.35);}
  .note-card:hover{background:rgba(255,255,255,0.6);}
  .note-card .status{font-size:0.68rem;letter-spacing:0.1em;text-transform:lowercase;color:var(--slate);margin-bottom:0.7rem;opacity:0.95;}
  .note-card .post-num{font-size:0.68rem;opacity:0.5;letter-spacing:0.1em;text-transform:lowercase;margin-bottom:0.4rem;}
  .note-card h3{font-family:'Cormorant Garamond',serif;font-size:1.35rem;margin-bottom:0.6rem;text-transform:lowercase;}
  .note-card p{font-size:0.95rem;line-height:1.6;opacity:0.85;}

  /* ABOUT / CV */
  .about{max-width:1300px;margin:0 auto;padding:4rem 2rem;display:grid;grid-template-columns:0.9fr 1.4fr;gap:4rem;align-items:start;}
  .about-heading{font-size:clamp(2.2rem,4.5vw,3.5rem);text-transform:lowercase;margin-bottom:1.4rem;}
  .about-write{
    font-family:'Cormorant Garamond',serif;font-size:clamp(1rem,1.6vw,1.15rem);
    line-height:1.65;text-transform:lowercase;max-width:540px;margin-bottom:1.6rem;
  }
  .about-write .accent-word{color:var(--pine);font-style:italic;}
  .cv-link{display:inline-block;margin-top:2rem;font-size:0.92rem;letter-spacing:0.08em;text-transform:lowercase;border-bottom:1px solid var(--ink);padding-bottom:2px;}

  .timeline{
    position:relative;padding-left:2.5rem;padding-right:0.8rem;
  }
  .t-item{position:relative;padding-bottom:2rem;}
  .t-item:last-child{padding-bottom:0;}
  .t-item::before{content:'';position:absolute;left:-2.5rem;top:6px;width:9px;height:9px;border-radius:50%;background:var(--pine);}
  .t-item:not(:last-child)::after{content:'';position:absolute;left:-2.25rem;top:6px;bottom:-6px;width:1px;background:rgba(30,32,31,0.2);}
  .t-row{display:grid;grid-template-columns:460px auto;gap:1.5rem;align-items:baseline;}
  .t-item .t-year{font-size:1.05rem;letter-spacing:0.05em;text-transform:lowercase;opacity:0.6;white-space:nowrap;}
  .t-item .t-role{font-size:1.26rem;font-weight:400;text-transform:lowercase;}
  .t-item .t-org{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.4rem;color:var(--slate);text-transform:lowercase;}
  .t-item .t-loc{font-size:1rem;opacity:0.55;margin-top:0.15rem;}

  /* PINBOARD: beyond the work — scattered collage, 2 rows tall, scrolls sideways */
  .pinboard-section{padding-bottom:2.5rem;}
  .pinboard-scroll{
    max-width:1300px;margin:0 auto;border-radius:10px;
    padding:1rem 0 1.3rem;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:thin;scrollbar-color:rgba(30,32,31,0.22) transparent;
    background:
      repeating-linear-gradient(0deg, rgba(30,32,31,0.035) 0 1px, transparent 1px 18px),
      repeating-linear-gradient(90deg, rgba(30,32,31,0.035) 0 1px, transparent 1px 18px),
      linear-gradient(120deg, var(--pine-tint) 0%, var(--slate-tint) 55%, var(--pine-tint) 100%);
    background-size:18px 18px, 18px 18px, 200% 200%;
  }
  .pinboard-scroll::-webkit-scrollbar{height:5px;}
  .pinboard-scroll::-webkit-scrollbar-track{background:transparent;}
  .pinboard-scroll::-webkit-scrollbar-thumb{background:rgba(30,32,31,0.22);border-radius:10px;}
  .pinboard-scroll::-webkit-scrollbar-thumb:hover{background:rgba(30,32,31,0.38);}
  .pinboard-track{
    display:flex;flex-direction:row;align-items:center;
    gap:0.5rem;width:max-content;padding:1rem 1.4rem;
  }
  .pin-col{display:flex;flex-direction:column;gap:0.5rem;}
  .pin-card, .pin-quote-card{--sz:150px;transform:rotate(var(--r,-1.5deg));transition:transform 0.2s ease;position:relative;}
  .pin-card:hover, .pin-quote-card:hover{transform:rotate(0deg) translateY(-2px) !important;z-index:3;}
  .pin-card .pin-media{
    width:var(--sz);height:var(--sz);border-radius:5px;background:var(--pine-tint);
    background-size:cover;background-position:center;margin-bottom:0.45rem;
    box-shadow:0 6px 14px rgba(30,32,31,0.16);
  }
  .pin-card .pin-tags{display:flex;flex-wrap:wrap;gap:0.3rem;max-width:var(--sz);}
  .pin-card .pin-tags span{
    font-size:0.68rem;letter-spacing:0.04em;text-transform:lowercase;opacity:0.75;
    border:1px solid rgba(30,32,31,0.22);padding:0.22rem 0.55rem;border-radius:var(--tag-radius);
  }
  .pin-quote-card{
    width:var(--sz);min-height:var(--sz);padding:1.1rem 0.95rem;
    background:
      radial-gradient(rgba(30,32,31,0.05) 1px, transparent 1.2px) 0 0/12px 12px,
      #fff;
    border-radius:2px;box-shadow:0 6px 14px rgba(30,32,31,0.14);
    display:flex;align-items:center;
  }
  .pin-quote-card p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.85rem;line-height:1.4;color:var(--ink);}

  /* GARDEN: plant your own */
  .garden-section{padding:4rem 2rem;background:var(--slate-tint);}
  .garden-eyebrow{max-width:1300px;margin:0 auto 0.8rem;font-size:1.15rem;letter-spacing:0.1em;opacity:0.55;text-transform:lowercase;}
  .garden-layout{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:0.8fr 1.6fr;gap:3rem;align-items:start;}
  .garden-left h2{font-size:clamp(1.7rem,3vw,2.3rem);text-transform:lowercase;margin-bottom:1.5rem;}
  .garden-instructions{display:flex;flex-direction:column;}
  .garden-instructions p{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.2rem;line-height:1.5;
    color:var(--slate);text-transform:lowercase;padding:1.2rem 0;
  }
  .g-divider{width:1px;height:28px;align-self:flex-start;margin-left:0.2rem;background:rgba(30,32,31,0.2);}
  .garden-right{display:flex;flex-direction:column;}
  .garden-bed{
    position:relative;width:100%;height:480px;border-radius:14px;overflow:hidden;
    background:linear-gradient(180deg, #cfe7d8 0%, #a9d4b6 40%, #8fc49f 100%);
    box-shadow:inset 0 4px 18px rgba(30,32,31,0.12), 0 12px 30px rgba(30,32,31,0.1);
    cursor:crosshair;
  }
  .garden-bed.tool-water{cursor:pointer;}
  .garden-plants{position:absolute;inset:0;}
  .g-plant{position:absolute;transform-origin:50% 100%;cursor:pointer;transition:transform 0.35s ease, filter 0.2s;}
  .g-plant:hover{filter:brightness(1.08);}
  .g-plant svg{display:block;overflow:visible;}
  .garden-toolbar{
    margin-top:0.9rem;display:flex;flex-wrap:wrap;gap:0.7rem;
    align-items:center;justify-content:center;
  }
  .g-tool{
    display:flex;align-items:center;gap:0.5rem;font-family:'Jost',sans-serif;font-size:0.8rem;
    text-transform:lowercase;letter-spacing:0.02em;background:#fff;border:1px solid rgba(30,32,31,0.15);
    padding:0.5rem 1rem;border-radius:999px;cursor:pointer;transition:all 0.2s;color:var(--ink);
  }
  .g-tool:hover{border-color:var(--slate);}
  .g-tool.active{background:var(--pine);border-color:var(--pine);color:var(--bg);}
  .g-tool-icon{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;}
  .g-tool-icon svg{width:100%;height:100%;}
  .g-tool-water{border-radius:6px;padding:0.5rem 1.1rem;}
  .g-tool-water.active{background:var(--slate);border-color:var(--slate);}
  .g-clear{
    font-family:'Jost',sans-serif;font-size:0.75rem;letter-spacing:0.05em;text-transform:lowercase;
    opacity:0.5;background:none;border:none;cursor:pointer;text-decoration:underline;margin-left:0.5rem;
  }
  .g-clear:hover{opacity:0.85;}
  @media(max-width:900px){ .garden-layout{grid-template-columns:1fr;} .garden-instructions{flex-direction:row;flex-wrap:wrap;gap:1rem;} .g-divider{width:1px;height:24px;} }
  @media(max-width:700px){ .garden-bed{height:320px;} }

  /* FOOTER / CONTACT */
  footer{background:var(--pine);color:var(--bg);padding:4.5rem 3rem 1.5rem;position:relative;overflow:hidden;}
  .foot-inner{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:1.3fr 1fr;gap:4rem;margin-bottom:2rem;align-items:start;}
  .foot-cta{
    font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,4.8vw,3.6rem);
    max-width:640px;margin-bottom:1rem;text-transform:lowercase;
  }
  .foot-cta .accent{color:var(--bg);opacity:0.8;}
  .foot-prompt{font-size:1.02rem;opacity:0.75;margin-bottom:2rem;max-width:480px;line-height:1.6;}
  .contact-form{display:flex;flex-direction:column;gap:1.1rem;max-width:480px;}
  .contact-form input, .contact-form textarea{
    background:transparent;border:none;border-bottom:1px solid rgba(246,248,245,0.35);

/* =========================================================
   CONTENT LOADING — everything below fetches from /content/*.json

   double-clicking the file, fetch() may be blocked by the browser;
   run it through a local server (or the live Netlify URL) instead.
   ========================================================= */
async function fetchJSON(path){
  try{
    const res = await fetch(path, { cache: "no-store" });
    if(!res.ok) throw new Error(res.status);
    return await res.json();
  }catch(err){
    console.warn("could not load", path, err);
    return null;
  }
}

function esc(str){
  const d = document.createElement("div");
  d.textContent = str == null ? "" : str;
  return d.innerHTML;
}

const TAG_TINT = {
  pine: "rgba(58,82,64,0.55)",
  sage: "rgba(124,139,91,0.55)",
  slate: "rgba(62,91,102,0.55)",
  "slate-light": "rgba(111,148,160,0.55)"
};

function mediaStyle(item){
  let s = item.image && item.image.trim() !== ""
    ? `background-image:url('${item.image}');`
    : `background-color:var(--${item.color || "pine"});`;
  s += `--tagtint:${TAG_TINT[item.color] || "rgba(30,32,31,0.4)"};`;
  return s;
}

function dot(){
  return '<span class="mdot">·</span>';
}
function dotify(str){
  return esc(str).split("·").join(dot());
}

function renderHero(data){

  rolesEl.innerHTML = (data.tags || []).map(t => `<span>${esc(t)}</span>`).join("");
  if (data.collageImage) {

}

function renderMarquee(data){

  document.getElementById("marqueeTrack").innerHTML = build() + build();

}

function renderTimeline(data){

  const el = document.getElementById("timelineList");
  el.innerHTML = (data.items || []).map(t => `
    <div class="t-item">

      <div class="t-org">${esc(t.org)}</div>

function renderPinboard(data){
  if(!data) return;
  document.getElementById("pinboardEyebrow").textContent = data.sectionEyebrow || "";
  document.getElementById("pinboardTitle").textContent = data.sectionTitle || "";
  document.getElementById("pinboardIntro").textContent = data.sectionIntro || "";
  const track = document.getElementById("pinboardTrack");
  const items = data.items || [];
  // sizes and tilt cycle through this pattern. items are grouped into columns
  // (mostly pairs, occasionally a single feature tile) and each column is its
  // own flex stack sized only to its own two items — no shared row-height
  // across columns, so there's no dead space left in a shorter column.
  // a few variants pull inward (ml) for a deliberate, occasional overlap.
  const VARIANTS = [
    { sz:175, r:-1.6, ml:0   },
    { sz:115, r:1.3,  ml:-14 },
    { sz:150, r:-1.0, ml:0   },
    { sz:220, r:0.6,  ml:0   },
    { sz:110, r:1.8,  ml:-10 },
    { sz:140, r:-1.4, ml:0   },
    { sz:160, r:1.0,  ml:0   },
    { sz:130, r:-0.8, ml:-14 },
    { sz:190, r:1.5,  ml:0   },
    { sz:120, r:-1.7, ml:0   }
  ];
  // photos/illustrations only ever use one of these three (largest) sizes —
  // quote cards keep cycling through the full VARIANTS sizes as before.
  const PHOTO_SIZES = [220, 190, 175];
  const tile = (item, i) => {
    const v = VARIANTS[i % VARIANTS.length];
    if(item.type === "quote"){
      const style = `--sz:${v.sz}px;--r:${v.r}deg;margin-left:${v.ml}px;`;
      return `<div class="pin-quote-card" style="${style}"><p>${esc(item.quoteText)}</p></div>`;
    }
    const sz = PHOTO_SIZES[i % PHOTO_SIZES.length];
    const style = `--sz:${sz}px;--r:${v.r}deg;margin-left:${v.ml}px;`;
    const tags = [item.caption, item.sub].filter(Boolean);
    return `
      <div class="pin-card" style="${style}">
        <div class="pin-media" style="${item.image ? `background-image:url('${item.image}')` : ""}"></div>
        <div class="pin-tags">${tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      </div>
    `;
  };
  const GROUP_PATTERN = [2];
  const groups = [];
  let idx = 0, p = 0;
  while (idx < items.length){
    const gsz = Math.min(GROUP_PATTERN[p % GROUP_PATTERN.length], items.length - idx);
    groups.push(items.slice(idx, idx + gsz));
    idx += gsz; p++;
  }
  let vi = 0;
  track.innerHTML = groups.map(group =>
    `<div class="pin-col">${group.map(item => tile(item, vi++)).join("")}</div>`
  ).join("");
}

function renderGarden(data){
  if(!data) return;
  document.getElementById("gardenEyebrow").innerHTML = dotify(data.eyebrow || "");

  document.getElementById("footPrompt").textContent = data.prompt || "";

    <a href="${esc(data.instagramPersonal)}" target="_blank" rel="noopener">instagram (personal)</a>
    <a href="${esc(data.instagramNote)}" target="_blank" rel="noopener">instagram (note)</a>
    <a href="${esc(data.linkedin)}" target="_blank" rel="noopener">linkedin</a>
  `;
  window.__contactEmail = data.email;
}

async function loadContent(){
  const [hero, marquee, practice, research, collaborations, note, about, timeline, pinboard, garden, footer] = await Promise.all([
    fetchJSON("content/hero.json"),
    fetchJSON("content/marquee.json"),
    fetchJSON("content/practice.json"),
    fetchJSON("content/research.json"),
    fetchJSON("content/collaborations.json"),
    fetchJSON("content/note.json"),
    fetchJSON("content/about.json"),
    fetchJSON("content/timeline.json"),
    fetchJSON("content/pinboard.json"),
    fetchJSON("content/garden.json"),
    fetchJSON("content/footer.json"),
  ]);
  renderHero(hero);
  renderMarquee(marquee);
  renderPractice(practice);
  renderResearch(research);
  renderCollaborations(collaborations);
  renderNote(note);
  renderAbout(about);
  renderTimeline(timeline);
  renderPinboard(pinboard);
  renderGarden(garden);
  renderFooter(footer);
}

const contentReady = loadContent();

/* ---------- SKIP-PRELOADER LOGIC ----------
   the intro only plays on a fresh open / refresh of the plain URL.
   links coming back from a project page carry ?from=project, which
   skips straight to the finished state, then cleans the URL so the
   next real refresh plays the intro again. ---------- */
const urlParams = new URLSearchParams(window.location.search);
const skipIntro = urlParams.get('from') === 'project';

if (skipIntro){
  history.replaceState({}, '', window.location.pathname + window.location.hash);
}

/* only jump to a #hash target when arriving from a project page's link
   (e.g. "get in touch" -> #contact). a plain open/refresh always shows
   the hero at top, even if a stray hash is sitting in the address bar
   from earlier browsing — the page is filled in by JS after fetch, so
   the browser's own scroll-to-hash-on-load fires too early and misses
   the target anyway, hence doing it ourselves once content exists.
   the preloader stays up (covering the page) through this whole
   sequence so the short-page/wrong-position flash never becomes
   visible — it only fades out once the scroll position is already
   correct and the content is fully in place. */
contentReady.then(()=>{
  if (skipIntro && window.location.hash){
    const target = document.querySelector(window.location.hash);
    if (target) target.scrollIntoView({ behavior:"instant", block:"start" });
  } else if (!skipIntro){
    window.scrollTo(0, 0);
  }
  if (skipIntro){
    playHero();
    revealAllInstant();
    gsap.to("#preloader", {
      opacity:0, duration:0.5, ease:"sine.inOut",
      onComplete: ()=>{ document.getElementById("preloader").style.display = "none"; }
    });
  }
});

const w0 = document.getElementById("plWord0");
const w1 = document.getElementById("plWord1");
const w2 = document.getElementById("plWord2");

const preTl = gsap.timeline({ onComplete: ()=>{
  gsap.to("#preloader", {
    yPercent:-100, duration:0.9, ease:"sine.inOut",
    onComplete: async ()=>{
      await contentReady;
      document.getElementById("preloader").style.display="none";
      playHero();
      setupContentAnimations();
    }
  });
}});

if (!skipIntro){
  preTl

    .to(w1, { opacity:1, duration:0.4, ease:"sine.out" }, "<0.1")
    .to({}, { duration:0.35 })
    .to(w1, { opacity:0.3, y:-30, duration:0.5, ease:"sine.inOut" }, "<")

/* ---------- HERO: label, then straight into the tagline (image is static, no reveal) ---------- */
function playHero(){
  const tl = gsap.timeline();
  tl.from(".hero .label", { opacity:0, y:15, duration:0.6, ease:"sine.out" })
    .to(".tagline, .roles span", { opacity:1, y:0, duration:0.8, stagger:0.06, ease:"sine.out" }, "<0.2");
}
gsap.set(".tagline, .roles span", { y:20 });

if (skipIntro){
  gsap.set(".hero .label", { opacity:1, y:0 });
  gsap.set(".tagline, .roles span", { opacity:1, y:0 });

/* ---------- SET UP ANIMATIONS THAT DEPEND ON RENDERED CONTENT ---------- */
function setupInteractivity(){
  document.querySelectorAll("a, .card, .note-card").forEach(el=>{
    el.addEventListener("mouseenter", ()=>cursorFlower.classList.add("hover"));
    el.addEventListener("mouseleave", ()=>cursorFlower.classList.remove("hover"));
  });
  document.querySelectorAll(".card").forEach(el=>addTilt(el,5));
}

function setupContentAnimations(){
  gsap.utils.toArray(".wipe").forEach(el=>{
    gsap.to(el, {
      clipPath:"inset(0 0% 0 0)", duration:1.1, ease:"power4.inOut",
      scrollTrigger:{ trigger: el, start:"top 85%" }
    });
  });

  gsap.utils.toArray(".card, .research-item, .note-card, .collab-card2").forEach(el=>{
    gsap.from(el, {
      opacity:0, y:40, duration:0.8, ease:"power2.out",
      scrollTrigger:{ trigger: el, start:"top 90%" }
    });
  });
  gsap.from(".about-write, .timeline", {
    opacity:0, y:30, duration:1, stagger:0.15, ease:"power2.out",
    scrollTrigger:{ trigger: ".about", start:"top 80%" }
  });

  setupInteractivity();
  ScrollTrigger.refresh();
}

/* returning from a project page (or "get in touch") jumps straight to a
   mid-page section instead of scrolling in from the top, so there's no
   reliable "enter" moment for the scroll-triggered reveals above to fire
   against — elements could get stuck at their hidden opacity:0 / clipped
   "from" state forever, which read as content having disappeared until a
   hard refresh. skip ScrollTrigger entirely for this path and just show
   everything already revealed. */
function revealAllInstant(){
  gsap.set(".wipe", { clipPath:"inset(0 0% 0 0)" });
  gsap.set(".card, .research-item, .note-card, .collab-card2, .about-write, .timeline", { opacity:1, y:0 });
  setupInteractivity();
}

/* ---------- NAV: fades more transparent the further you scroll ---------- */
function updateNavAlpha(){
  const alpha = Math.max(0.15, 0.55 - (window.scrollY / 500) * 0.4);
  document.documentElement.style.setProperty("--nav-alpha", alpha.toFixed(3));
}
window.addEventListener("scroll", updateNavAlpha, { passive:true });
updateNavAlpha();

/* ---------- FLOWER CURSOR ---------- */
const cursorFlower = document.getElementById("cursorFlower");
window.addEventListener("mousemove", e=>{
  gsap.to(cursorFlower,{x:e.clientX,y:e.clientY,duration:0.15});
});
gsap.to(cursorFlower, { rotation:360, duration:14, repeat:-1, ease:"none", transformOrigin:"50% 50%" });

/* ---------- CARD TILT ---------- */
function addTilt(el, max=6){
  el.addEventListener("mousemove", e=>{
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left)/r.width - 0.5;
    const py = (e.clientY - r.top)/r.height - 0.5;
    gsap.to(el, { rotateY: px*max, rotateX: -py*max, duration:0.4, ease:"power2.out", transformPerspective:800 });
  });
  el.addEventListener("mouseleave", ()=>{
    gsap.to(el, { rotateY:0, rotateX:0, duration:0.6, ease:"power3.out" });
  });
}

/* ---------- CONTACT FORM (mailto fallback until a form backend is wired) ---------- */

if (contactForm){

  });
}

/* ---------- FOOTER CLOCK (IST, india only) ---------- */
function updateClock(){
  const now = new Date();
  const ist = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));
  const hh = String(ist.getHours()).padStart(2,"0");
  const mm = String(ist.getMinutes()).padStart(2,"0");
  const ss = String(ist.getSeconds()).padStart(2,"0");
  document.getElementById("footClock").textContent = `${hh}:${mm}:${ss}`;
}
updateClock();
setInterval(updateClock, 1000);
