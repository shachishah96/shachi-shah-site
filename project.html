<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">project · shachi shah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="projects/project.css">
<style>
  .proj-media div{background-size:cover;background-position:center;}
  .not-found{max-width:640px;margin:9rem auto;padding:0 2rem;text-align:center;}
  .not-found h1{font-size:2rem;margin-bottom:1rem;}
  .not-found a{border-bottom:1px solid var(--ink);}
</style>
</head>
<body>
<div class="proj-nav"><a href="index.html?from=project">&larr; back to shachi shah</a></div>

<div id="projectRoot"></div>

<script>
const COLOR_DARK = {
  pine: "#242f27",
  sage: "#5c6a43",
  slate: "#233842",
  "slate-light": "#4d707c"
};

function esc(str){
  const d = document.createElement("div");
  d.textContent = str == null ? "" : str;
  return d.innerHTML;
}

async function fetchJSON(path){
  try{
    const res = await fetch(path, { cache: "no-store" });
    if(!res.ok) throw new Error(res.status);
    return await res.json();
  }catch(err){
    console.warn("could not load", path, err);
    return null;
  }
}

function bodyToHTML(body){
  return (body || []).map(block => {
    if(block.startsWith("## ")) return `<h2>${esc(block.slice(3))}</h2>`;
    return `<p>${esc(block)}</p>`;
  }).join("\n");
}

function renderNotFound(){
  document.getElementById("projectRoot").innerHTML = `
    <div class="not-found">
      <h1>this project isn't up yet</h1>
      <p><a href="shachi-shah-prototype.html?from=project">back to shachi shah &rarr;</a></p>
    </div>`;
}

function renderProject(item, section){
  const metaTop = section === "research"
    ? `research · ${esc(item.sub || "")} · ${esc(item.year || "")}`
    : `practice · ${esc(item.meta || "")}`;
  const tags = item.detailTags && item.detailTags.length ? item.detailTags : (item.tags || []);
  const dark = COLOR_DARK[item.color] || "#242f27";

  document.title = `${item.title} · shachi shah`;

  const galleryImages = (item.gallery || []).map(g => (typeof g === "string" ? g : g && g.src)).filter(Boolean);
  if(galleryImages.length === 0 && item.image && item.image.trim() !== ""){
    galleryImages.push(item.image);
  }

  const carouselHTML = galleryImages.length
    ? `
      <div class="proj-carousel-inner">
        <div class="proj-carousel-frame">
          <img id="carouselImg" src="${esc(galleryImages[0])}" alt="${esc(item.title)}">
        </div>
      </div>
      ${galleryImages.length > 1 ? `
        <div class="carousel-arrow prev" id="prevBtn">&#8249;</div>
        <div class="carousel-arrow next" id="nextBtn">&#8250;</div>
        <div class="carousel-dots" id="carouselDots">
          ${galleryImages.map((_,i)=>`<span class="${i===0?"active":""}" data-i="${i}"></span>`).join("")}
        </div>
      ` : ""}
    `
    : `<div class="proj-carousel-inner"><div class="proj-ph-block"></div></div>`;

  const factsHTML = (item.facts || []).map(f => `
    <div><div class="f-label">${esc(f.label)}</div><div class="f-value">${esc(f.value)}</div></div>
  `).join("");

  document.getElementById("projectRoot").innerHTML = `
    <div class="proj-header" style="background:linear-gradient(160deg,var(--${item.color || "pine"}) 0%,${dark} 100%);">
      <div class="proj-header-inner">
        <div class="proj-meta-top">${metaTop}</div>
        <h1>${esc(item.title)}</h1>
        <div class="proj-tags">${tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      </div>
    </div>

    <div class="proj-carousel">${carouselHTML}</div>

    ${factsHTML ? `<div class="proj-facts-wrap"><div class="proj-facts">${factsHTML}</div></div>` : ""}

    <div class="proj-body">
      ${bodyToHTML(item.body)}
    </div>

    <div class="proj-footer">
      <a href="index.html?from=project#contact">get in touch about a project like this</a>
    </div>
  `;

  if(galleryImages.length > 1){
    let idx = 0;
    const imgEl = document.getElementById("carouselImg");
    const dots = document.querySelectorAll("#carouselDots span");
    function show(i){
      idx = (i + galleryImages.length) % galleryImages.length;
      imgEl.src = galleryImages[idx];
      dots.forEach((d, di) => d.classList.toggle("active", di === idx));
    }
    document.getElementById("prevBtn").addEventListener("click", () => show(idx - 1));
    document.getElementById("nextBtn").addEventListener("click", () => show(idx + 1));
    dots.forEach(d => d.addEventListener("click", () => show(Number(d.dataset.i))));
  }
}

async function init(){
  const id = new URLSearchParams(window.location.search).get("id");
  if(!id){ renderNotFound(); return; }

  const [practice, research] = await Promise.all([
    fetchJSON("content/practice.json"),
    fetchJSON("content/research.json")
  ]);

  const fromPractice = practice && practice.items ? practice.items.find(i => i.id === id) : null;
  if(fromPractice){ renderProject(fromPractice, "practice"); return; }

  const fromResearch = research && research.items ? research.items.find(i => i.id === id) : null;
  if(fromResearch){ renderProject(fromResearch, "research"); return; }

  renderNotFound();
}
init();
</script>
</body>
</html>
